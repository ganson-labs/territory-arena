<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Захват территории</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%227%22 height=%227%22 fill=%22%23e8825a%22/%3E%3Crect x=%228%22 y=%228%22 width=%227%22 height=%227%22 fill=%22%234fc3c9%22/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,600;0,700;1,500&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <form id="menu" onsubmit="return false">
    <div class="row">
      <label>Первая команда <select id="botA"></select></label>
      <span class="vs">vs</span>
      <label>Вторая команда <select id="botB"></select></label>
    </div>
    <div class="row">
      <label>Матч до побед <input id="firstTo" type="number" min="1" max="9" value="2"></label>
      <label>Раундов в турнире с доработкой <input id="tourRounds" type="number" min="1" max="9" value="3"></label>
      <button type="button" id="btnReload" class="ghost">Обновить список</button>
    </div>
    <div class="row">
      <button type="button" id="btnIntro">Представление и бой</button>
      <button type="button" id="btnFight" class="ghost">Сразу бой</button>
      <button type="button" id="btnTour" class="ghost">Турнир с доработкой</button>
    </div>
    <p id="status"></p>
    <p class="keys">Пробел — старт/пауза · 1/2/3/4/0 — скорость ×1/×2/×4/×8/×0.5 · M — звук · F — полный экран · D — отладка · N — следующий раунд турнира · Esc — меню</p>
  </form>
  <button type="button" id="btnNext" hidden>Следующий раунд</button>
  <script type="module" src="main.js"></script>
</body>
</html>
